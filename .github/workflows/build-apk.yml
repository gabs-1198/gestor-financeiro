name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android Build Tools e Platform 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/build-tools" "$SDK/platforms"
          SM=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          else
            python3 - << 'PYEOF'
          import urllib.request, zipfile, os

          sdk = os.environ.get('ANDROID_HOME') or '/usr/local/lib/android/sdk'

          def ensure(url, parent, target_name):
              dst = os.path.join(parent, target_name)
              if os.path.exists(dst):
                  print('Already exists:', dst)
                  return
              zp = '/tmp/' + os.path.basename(url)
              print('Downloading:', url)
              urllib.request.urlretrieve(url, zp)
              with zipfile.ZipFile(zp, 'r') as z:
                  top = z.namelist()[0].split('/')[0]
                  z.extractall(parent)
              os.remove(zp)
              src = os.path.join(parent, top)
              if src != dst and os.path.exists(src) and not os.path.exists(dst):
                  os.rename(src, dst)
              print('Ready:', dst)

          ensure('https://dl.google.com/android/repository/build-tools_r34-linux.zip', os.path.join(sdk, 'build-tools'), '34.0.0')
          ensure('https://dl.google.com/android/repository/platform-34-ext12_r01.zip', os.path.join(sdk, 'platforms'), 'android-34')
          PYEOF
            chmod -R +x "$SDK/build-tools/34.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Compilar e Assinar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p build/compiled_res build/classes build/dex build/out build/assets
          cp -r www build/assets/www

          "$BT/aapt2" compile --dir android/res -o build/compiled_res/res.zip
          "$BT/aapt2" link -o build/out/unaligned.apk -I "$ANDROID_JAR" \
            --manifest android/AndroidManifest.xml -A build/assets --java android/src \
            --auto-add-overlay build/compiled_res/res.zip

          javac -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" \
            -d build/classes $(find android/src -name "*.java")

          "$BT/d8" --min-api 24 --lib "$ANDROID_JAR" --output build/dex \
            $(find build/classes -name "*.class")

          cp build/dex/classes.dex .
          "$BT/aapt" add build/out/unaligned.apk classes.dex
          rm classes.dex

          "$BT/zipalign" -f -p 4 build/out/unaligned.apk build/out/aligned.apk

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > build/release.keystore
            KS_PATH="build/release.keystore"
            KS_PASS="${KEYSTORE_PASS}"
            KS_ALIAS="${KEY_ALIAS}"
            K_PASS="${KEY_PASS:-$KS_PASS}"
          else
            keytool -genkeypair -v -keystore build/ci-release.keystore -alias gestor \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci123456 -keypass ci123456 \
              -dname "CN=GestorFinanceiro, O=OpenSource, C=BR"
            KS_PATH="build/ci-release.keystore"
            KS_PASS="ci123456"
            KS_ALIAS="gestor"
            K_PASS="ci123456"
          fi

          "$BT/apksigner" sign --ks "$KS_PATH" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$K_PASS" --ks-key-alias "$KS_ALIAS" \
            --out build/GestorFinanceiro.apk build/out/aligned.apk

          "$BT/apksigner" verify --verbose build/GestorFinanceiro.apk

      - name: Salvar APK como Artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: GestorFinanceiro-APK
          path: build/GestorFinanceiro.apk

      - name: Publicar no GitHub Releases (em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/GestorFinanceiro.apk
          name: Gestor Financeiro ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
